<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock - Paper - Scissors</title>
</head>

<body>
  <header>
    <h1>Rock - Paper - Scissors</h1>
    <nav>
      <p>👤 Player: <span id="player-score">0</span></p>
      <p>🤖 Computer: <span id="computer-score">0</span></p>
    </nav>
  </header>
  <section class="choices">
    <button id="rock" type="button">🪨 Rock</button>
    <button id="paper" type="button">📄 Paper</button>
    <button id="scissors" type="button">✂️ Scissors</button>
  </section>
</body>

</html>
